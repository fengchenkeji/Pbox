# Pbox - Android APK 自动构建（Qt 6.12.0 for Android + NDK）
# 说明：Qt 6.7+ 的 Android 预编译包位于官方 all_os 源，install-qt-action
# 对 target=android 且 version>=6.7 会自动使用 host=all_os 并安装匹配的 host Qt。
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runner 已预装 Android SDK + NDK + cmake，动态探测
      - name: Prepare Android NDK/CMake (runner 预装)
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          # Qt 6 Android 宏识别 ANDROID_SDK_ROOT，必须设置
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/build-tools" && echo "build-tools: $(ls "${ANDROID_HOME}/build-tools" | tr '\n' ' ')" || echo "!! 无 build-tools"
          NDK="$(ls -d "${ANDROID_HOME}"/ndk/*/ 2>/dev/null | head -1 | sed 's#/$##')"
          test -n "$NDK"
          echo "ANDROID_NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "使用 NDK: ${NDK}"
          CMAKE_BIN="$(ls "${ANDROID_HOME}"/cmake/*/bin/cmake 2>/dev/null | head -1)"
          test -n "$CMAKE_BIN"
          echo "ANDROID_CMAKE=${CMAKE_BIN}" >> "$GITHUB_ENV"
          echo "使用 cmake: ${CMAKE_BIN}"

      # Qt 6.12.0 for Android（android_arm64_v8a），自动配 host Qt 到 QT_HOST_PATH
      - name: Install Qt 6.12.0 for Android
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qttasktree'
          dir: '${{ github.workspace }}/qt'

      # 下载 proot 二进制（Termux 仓库），打进 APK assets
      - name: Download proot binary
        run: |
          set -e
          mkdir -p android/assets
          # 从 Termux 仓库动态解析最新 proot (aarch64) deb 版本
          PROOT_VER="$(curl -s "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/" \
            | grep -oE 'proot_[0-9._]+_aarch64\.deb' | sort -V | tail -1)"
          test -n "$PROOT_VER"
          echo "下载 proot 包: $PROOT_VER"
          URL="https://packages.termux.dev/apt/termux-main/pool/main/p/proot/${PROOT_VER}"
          curl -fsSL -o /tmp/proot.deb "$URL"
          test -f /tmp/proot.deb
          rm -rf /tmp/prootx && mkdir -p /tmp/prootx
          dpkg-deb -x /tmp/proot.deb /tmp/prootx
          BIN=/tmp/prootx/data/data/com.termux/files/usr/bin/proot
          test -f "$BIN"
          cp "$BIN" android/assets/proot
          chmod +x android/assets/proot
          file android/assets/proot

      - name: Configure (NDK cross-compile)
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=$QT_HOST_PATH"
          # Qt6AndroidMacros 通过 cmake 变量/环境读取 Android SDK 路径，必须显式传入
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          echo "=== QT_ROOT_DIR 结构 ==="
          ls "$QT_ROOT_DIR" 2>/dev/null | sed 's#^#  #'
          ls "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake" 2>/dev/null && echo "Qt6Config OK" || echo "Qt6Config 缺失"
          "${{ env.ANDROID_CMAKE }}" -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_HOME}" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=NEVER \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: |
          "${{ env.ANDROID_CMAKE }}" --build build --config Release
          echo "=== artifacts ==="
          find build -iname "*.apk" -o -iname "*.aab" 2>/dev/null | sed 's#^#  #'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pbox-APK
          path: |
            build/**/*.apk
            build/**/*.aab
          if-no-files-found: error
