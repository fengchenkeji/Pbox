name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  QT_VERSION: "6.5.3"
  QT_ARCH: "android_arm64_v8a"
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}/Qt
          modules: 'qtquickcontrols2 qtwebview'
          hosted: 'linux'
          set-env: 'false'

      - name: Download proot from Termux
        run: |
          set -e
          REPO="https://packages.termux.dev/apt/termux-main"
          ARCH="aarch64"

          echo "=== 下载proot deb包 ==="
          curl -fL "${REPO}/dists/stable/main/binary-${ARCH}/Packages" -o /tmp/Packages
          PROOT_DEB=$(grep -A30 "^Package: proot$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          curl -fL "${REPO}/${PROOT_DEB}" -o /tmp/proot.deb
          dpkg-deb -x /tmp/proot.deb /tmp/proot-extract

          echo "=== 下载libtalloc ==="
          TALLOC_DEB=$(grep -A30 "^Package: libtalloc$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          curl -fL "${REPO}/${TALLOC_DEB}" -o /tmp/talloc.deb
          dpkg-deb -x /tmp/talloc.deb /tmp/talloc-extract

          # 提取proot二进制，重命名为libpbox_proot.so以便打包进APK
          PROOT_BIN=$(find /tmp/proot-extract -name proot -type f | head -1)
          echo "proot binary: $PROOT_BIN"
          cp "$PROOT_BIN" /tmp/libpbox_proot.so
          chmod +x /tmp/libpbox_proot.so
          file /tmp/libpbox_proot.so

          # 提取loader
          find /tmp/proot-extract -name "*.so" -exec cp {} /tmp/ \; 2>/dev/null || true
          ls -la /tmp/*.so || true

          # libtalloc
          find /tmp/talloc-extract -name "libtalloc.so*" -exec cp {} /tmp/ \; 2>/dev/null || true

          echo "PROOT_LIB=/tmp/libpbox_proot.so" >> $GITHUB_ENV

      - name: Build with CMake
        run: |
          set -e

          QT_DIR="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/gcc_64"
          # android_arch路径
          QT_ANDROID_DIR="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

          NDK_DIR="${ANDROID_HOME}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          HOST_TAG=$(ls "$NDK_DIR/toolchains/llvm/prebuilt/")

          echo "=== 环境信息 ==="
          echo "Qt Android: $QT_ANDROID_DIR"
          echo "NDK: $NDK_DIR"
          echo "Host tag: $HOST_TAG"

          mkdir -p android-app/build
          cd android-app/build

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-24" \
            -DANDROID_STL="c++_shared" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_DIR" \
            -DQT_HOST_PATH="$QT_DIR" \
            -DPBOX_PROOT_LIB="/tmp/libpbox_proot.so" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DCMAKE_FIND_ROOT_PATH="$QT_ANDROID_DIR"

          make -j$(nproc)
          ls -la

      - name: Build APK
        run: |
          cd android-app/build
          # androiddeployqt 打包APK
          QT_ANDROID_DIR="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

          # 生成的APK在 build/android-build/ 下
          ls -la android-build/ 2>/dev/null || true

          # 如果没有自动生成APK，手动用gradle
          if [ -f "android-build/build.gradle" ]; then
            cd android-build
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            find . -name "*.apk"
          fi

      - name: Rename APK
        run: |
          APK=$(find android-app -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" pbox-android-arm64.apk
            ls -lh pbox-android-arm64.apk
          else
            echo "WARNING: No APK found"
            find android-app -type f | head -50
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pbox-android-apk
          path: |
            pbox-android-arm64.apk
            android-app/build/android-build/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
