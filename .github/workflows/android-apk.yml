name: Build Android APK
on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
env:
  QT_VERSION: "6.5.2"
  QT_ARCH: "android_arm64_v8a"
  ANDROID_API: "26"   # minSdk: Android 8.0

jobs:
  build-apk:
    name: Build APK (arm64-v8a) Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 自动发现NDK路径
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d | sort | tail -1)
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK: $(basename $NDK_DIR)"

      - name: 准备Android SDK (API 35)
        run: |
          for d in "$ANDROID_HOME/platforms/"android-*; do sudo rm -rf "$d"; done
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: Install Qt Desktop
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          dir: ${{ github.workspace }}/Qt
          set-env: 'false'

      - name: Install Qt Android
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}/Qt
          set-env: 'false'

      - name: 下载 proot (Termux deb)
        run: |
          set -e
          REPO="https://packages.termux.dev/apt/termux-main"
          ARCH="aarch64"
          curl -fL "${REPO}/dists/stable/main/binary-${ARCH}/Packages" -o /tmp/Packages
          PROOT_DEB=$(grep -A30 "^Package: proot$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          curl -fL "${REPO}/${PROOT_DEB}" -o /tmp/proot.deb
          dpkg-deb -x /tmp/proot.deb /tmp/proot-extract
          TALLOC_DEB=$(grep -A30 "^Package: libtalloc$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          curl -fL "${REPO}/${TALLOC_DEB}" -o /tmp/talloc.deb
          dpkg-deb -x /tmp/talloc.deb /tmp/talloc-extract
          # 提取 proot 二进制，重命名为 libpbox_proot.so（Android W^X 要求）
          PROOT_BIN=$(find /tmp/proot-extract -name proot -type f | head -1)
          cp "$PROOT_BIN" /tmp/libpbox_proot.so
          chmod +x /tmp/libpbox_proot.so
          # loader
          find /tmp/proot-extract -name "libproot-loader*.so" -exec cp {} /tmp/ \; 2>/dev/null || true
          find /tmp/talloc-extract -name "libtalloc.so*" -exec cp {} /tmp/ \; 2>/dev/null || true
          ls -la /tmp/*.so*

      - name: CMake 构建
        run: |
          set -e
          QT_ROOT="${{ github.workspace }}/Qt/Qt"
          QT_ANDROID_DIR="${QT_ROOT}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"
          QT_HOST_DIR="${QT_ROOT}/${{ env.QT_VERSION }}/gcc_64"
          echo "=== Qt 目录检查 ==="
          ls "$QT_ROOT/${{ env.QT_VERSION }}/"
          find "$QT_ANDROID_DIR" -name "Qt6Config.cmake" 2>/dev/null | head -3
          echo "QT_ANDROID_DIR=$QT_ANDROID_DIR"
          mkdir -p android-app/build
          cd android-app/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-${{ env.ANDROID_API }}" \
            -DANDROID_STL="c++_shared" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_DIR" \
            -DQT_HOST_PATH="$QT_HOST_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$QT_ANDROID_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DQt6_DIR="$QT_ANDROID_DIR/lib/cmake/Qt6" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$NDK_DIR"
          make -j$(nproc)

      - name: 打包 APK
        run: |
          cd android-app/build
          if [ -d "android-build" ]; then
            mkdir -p android-build/libs/arm64-v8a
            cp /tmp/libpbox_proot.so android-build/libs/arm64-v8a/
            # proot loader 和依赖
            find /tmp -maxdepth 1 -name "libproot-loader*.so" -exec cp {} android-build/libs/arm64-v8a/ \; 2>/dev/null || true
            find /tmp -maxdepth 1 -name "libtalloc.so*" -exec cp {} android-build/libs/arm64-v8a/ \; 2>/dev/null || true
            ls -la android-build/libs/arm64-v8a/
            cd android-build
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            find . -name "*.apk"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pbox-android-arm64-apk
          path: |
            android-app/build/android-build/build/outputs/apk/**/*.apk
          retention-days: 30
