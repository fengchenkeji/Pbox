# Pbox - Android APK 自动构建（Qt 6.12 + NDK）
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: "6.12.0"
      QT_DIR: "${{ github.workspace }}/qt"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runner 已预装 Android SDK + NDK + cmake，动态探测路径
      - name: Prepare Android SDK/NDK (runner 预装)
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK="$(ls -d "${ANDROID_HOME}"/ndk/*/ 2>/dev/null | head -1 | sed 's#/$##')"
          test -n "$NDK"
          echo "ANDROID_NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "使用 NDK: ${NDK}"
          test -f "${NDK}/build/cmake/android.toolchain.cmake"
          CMAKE_BIN="$(ls "${ANDROID_HOME}"/cmake/*/bin/cmake 2>/dev/null | head -1)"
          test -n "$CMAKE_BIN"
          echo "ANDROID_CMAKE=${CMAKE_BIN}" >> "$GITHUB_ENV"
          echo "使用 cmake: ${CMAKE_BIN}"
          ls "${ANDROID_HOME}"/platforms/android-* 2>/dev/null | sed 's#^#  #' | tail -3

      # 主机 Qt（供 androiddeployqt 使用）
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          dir: ${{ env.QT_DIR }}

      # Android Qt (arm64-v8a)
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          dir: ${{ env.QT_DIR }}

      # 下载 proot 二进制（Termux 仓库），打进 APK assets
      - name: Download proot binary
        run: |
          set -e
          mkdir -p android/assets
          ARCH_TERMUX="arm64"
          for VER in 5.4.0 5.3.0 5.2.0 5.1.1; do
            URL="https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_${VER}_${ARCH_TERMUX}.deb"
            if curl -fsSL -o /tmp/proot.deb "$URL"; then
              echo "Downloaded proot ${VER}"
              break
            fi
          done
          test -f /tmp/proot.deb
          rm -rf /tmp/prootx && mkdir -p /tmp/prootx
          dpkg-deb -x /tmp/proot.deb /tmp/prootx
          BIN=/tmp/prootx/data/data/com.termux/files/usr/bin/proot
          test -f "$BIN"
          cp "$BIN" android/assets/proot
          chmod +x android/assets/proot
          file android/assets/proot

      - name: Configure (NDK cross-compile)
        run: |
          QT_ANDROID="${{ env.QT_DIR }}/${{ env.QT_VERSION }}/android_arm64_v8a"
          QT_HOST="${{ env.QT_DIR }}/${{ env.QT_VERSION }}/gcc_64"
          "${{ env.ANDROID_CMAKE }}" -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID" \
            -DQT_HOST_PATH="$QT_HOST" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: |
          "${{ env.ANDROID_CMAKE }}" --build build --config Release
          echo "=== artifacts ==="
          find build -iname "*.apk" -o -iname "*.aab" 2>/dev/null | sed 's#^#  #'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pbox-APK
          path: |
            build/**/*.apk
            build/**/*.aab
          if-no-files-found: error
