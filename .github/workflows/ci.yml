name: Pbox CI (termux-packages)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm]
      fail-fast: false

    steps:
      - name: Checkout Pbox source
        uses: actions/checkout@v4
        with:
          path: Pbox

      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages

      - name: Setup Pbox package in termux-packages
        run: |
          mkdir -p termux-packages/packages/pbox
          # 复制 Pbox 全部源码到包目录
          cp -r Pbox/* termux-packages/packages/pbox/
          # build.sh 作为 term-packages 包脚本
          cp Pbox/build.sh termux-packages/packages/pbox/build.sh
          ls -la termux-packages/packages/pbox/

      - name: Build pbox package (Docker)
        run: |
          cd termux-packages
          # 使用 termux-packages 官方 Docker 构建环境
          ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.arch }} pbox 2>&1 | tail -100

      - name: Collect .deb artifact
        run: |
          mkdir -p /tmp/debs
          # 只收集 pbox 自己的 .deb，不收集依赖包（避免文件名含冒号等非法字符）
          find termux-packages/output -name "pbox_*.deb" -exec cp {} /tmp/debs/ \;
          ls -la /tmp/debs/
          # 列出 deb 内容
          for deb in /tmp/debs/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -c "$deb" | head -30
          done

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: pbox-${{ matrix.arch }}.deb
          path: /tmp/debs/*.deb
          retention-days: 30
