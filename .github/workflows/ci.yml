name: Pbox CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb (${{ matrix.repo_arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo_arch: aarch64
            abi: arm64-v8a
            api: 24
          - repo_arch: arm
            abi: armeabi-v7a
            api: 21
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq binutils dpkg-dev curl

      - name: Setup Android NDK
        run: |
          NDK_DIR=""
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK..."
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
            yes | "$SDKMANAGER" --install "ndk;26.1.10909125" 2>&1 | tail -5
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          fi
          HOST_TAG=$(ls "$NDK_DIR/toolchains/llvm/prebuilt/" | head -1)
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "HOST_TAG=$HOST_TAG" >> $GITHUB_ENV

      - name: Download termux deps and proot
        run: |
          REPO="https://packages.termux.dev/apt/termux-main"
          ARCH="${{ matrix.repo_arch }}"
          curl -fL "${REPO}/dists/stable/main/binary-${ARCH}/Packages" -o /tmp/Packages
          mkdir -p /tmp/deps/extract /tmp/proot-extract
          for pkg in libspdlog libcurl libtalloc; do
            DEB_PATH=$(grep -A30 "^Package: ${pkg}$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
            if [ -n "$DEB_PATH" ]; then
              curl -fL "${REPO}/${DEB_PATH}" -o "/tmp/deps/${pkg}.deb"
              dpkg-deb -x "/tmp/deps/${pkg}.deb" /tmp/deps/extract
              echo "OK: $pkg"
            fi
          done
          PROOT_DEB=$(grep -A30 "^Package: proot$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          curl -fL "${REPO}/${PROOT_DEB}" -o /tmp/deps/proot.deb
          dpkg-deb -x /tmp/deps/proot.deb /tmp/proot-extract
          echo "OK: proot"
          mkdir -p /tmp/deps/lib /tmp/deps/include
          cp -a /tmp/deps/extract/data/data/com.termux/files/usr/lib/*.so* /tmp/deps/lib/ 2>/dev/null || true
          cp -a /tmp/deps/extract/data/data/com.termux/files/usr/include/* /tmp/deps/include/ 2>/dev/null || true
          ls /tmp/deps/lib/ | head -20
          echo "DEPS_ROOT=/tmp/deps" >> $GITHUB_ENV

      - name: Build Pbox
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DANDROID_STL=c++_shared \
            -DPBOX_MANUAL_DEPS=ON \
            -DPBOX_DEPS_ROOT="$DEPS_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Os -Wall"
          make -C build -j$(nproc) VERBOSE=1
          file build/main
          file build/lib/*.so

      - name: Create .deb
        run: |
          PKG_ROOT=/tmp/pbox-deb
          rm -rf "$PKG_ROOT"
          PBOX_HOME="$PKG_ROOT/data/data/com.termux/files/usr/opt/Pbox"
          mkdir -p "$PKG_ROOT/DEBIAN" "$PBOX_HOME/lib" "$PBOX_HOME/bin" "$PBOX_HOME/res"
          mkdir -p "$PKG_ROOT/data/data/com.termux/files/usr/bin"
          mkdir -p "$PKG_ROOT/data/data/com.termux/files/usr/share/doc/pbox"
          cp build/main "$PBOX_HOME/pbox"
          chmod +x "$PBOX_HOME/pbox"
          cp build/lib/*.so "$PBOX_HOME/lib/" 2>/dev/null || true
          PROOT_BIN=$(find /tmp/proot-extract -name proot -type f | head -1)
          cp "$PROOT_BIN" "$PBOX_HOME/bin/proot"
          chmod +x "$PBOX_HOME/bin/proot"
          cp -a /tmp/deps/lib/*.so* "$PBOX_HOME/lib/" 2>/dev/null || true
          cp -r res/* "$PBOX_HOME/res/" 2>/dev/null || true
          printf '#!/data/data/com.termux/files/usr/bin/sh\nexport LD_LIBRARY_PATH="${PREFIX}/opt/Pbox/lib:${LD_LIBRARY_PATH}"\nexec "${PREFIX}/opt/Pbox/pbox" "$@"\n' > "$PKG_ROOT/data/data/com.termux/files/usr/bin/pbox"
          chmod +x "$PKG_ROOT/data/data/com.termux/files/usr/bin/pbox"
          printf 'Package: pbox\nVersion: 0.0.2\nArchitecture: %s\nMaintainer: fengchenkeji <399233159@qq.com>\nDepends: libspdlog, libcurl\nHomepage: https://github.com/fengchenkeji/Pbox\nDescription: A proot container management tool for Termux\n' "${{ matrix.repo_arch }}" > "$PKG_ROOT/DEBIAN/control"
          DEB_NAME="pbox_0.0.2_${{ matrix.repo_arch }}.deb"
          dpkg-deb --build "$PKG_ROOT" "/tmp/${DEB_NAME}"
          echo "=== Contents ==="
          dpkg-deb -c "/tmp/${DEB_NAME}"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: pbox-${{ matrix.repo_arch }}.deb
          path: /tmp/*.deb
          retention-days: 30
