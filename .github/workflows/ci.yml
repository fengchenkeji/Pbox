name: Pbox CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Android-Proot-Builder release download URL (public, no token needed)
  PROOT_RELEASE_URL: https://github.com/fengchenkeji/Android-Proot-Builder/releases/download/proot-latest/proot-android.zip

jobs:
  # ============================================================
  # Job 1: Linux x86_64 构建 + libproot.so dlopen 实际调用测试
  # ============================================================
  build-linux:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            libspdlog-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            libtalloc-dev \
            libarchive-dev \
            binutils \
            zip

      - name: Build libproot.so from source (Linux glibc)
        run: |
          # Android-Proot-Builder 的 x86_64 产物是 Android Bionic 版本，无法在 Linux glibc 上 dlopen
          # 因此 Linux job 从 termux/proot 源码用本机 gcc 编译 glibc 版本的 libproot.so
          chmod +x scripts/build-proot-linux.sh
          ./scripts/build-proot-linux.sh lib/x86_64
          ls -la lib/x86_64/

      - name: Verify libproot.so (static analysis)
        run: |
          SO=lib/x86_64/libproot.so
          echo "=== file ==="
          file "$SO"
          echo "=== ELF header ==="
          readelf -h "$SO" | grep -E "Class|Type|Machine"
          echo "=== main symbol ==="
          readelf -s --wide "$SO" | grep -w "main" || echo "main not in .dynsym, checking .symtab..."
          nm "$SO" 2>/dev/null | grep -w "main" || echo "main not found via nm"
          echo "=== dynamic dependencies ==="
          readelf -d "$SO" | grep NEEDED || true
          # Must be a shared object
          if file "$SO" | grep -q "shared object"; then
            echo "[OK] libproot.so is a shared object"
          else
            echo "::error::libproot.so is NOT a shared object"
            exit 1
          fi

      - name: Configure Pbox
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Os -Wall"

      - name: Build Pbox
        run: |
          cmake --build build -j$(nproc)

      - name: Verify build artifacts
        run: |
          echo "=== Build output ==="
          ls -la build/
          ls -la build/lib/
          file build/main
          file build/lib/libinitialization.so

      - name: Test libproot.so dlopen call chain
        run: |
          chmod +x scripts/test-proot-call.sh
          ./scripts/test-proot-call.sh build

      - name: Test Pbox CLI
        run: |
          cd build
          echo "=== pbox --help ==="
          ./main --help
          echo ""
          echo "=== pbox list (first 10 lines) ==="
          ./main list 2>&1 | head -10 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbox-linux-x86_64
          path: |
            build/main
            build/lib/*.so
            lib/x86_64/libproot.so
          retention-days: 7

  # ============================================================
  # Job 2 & 3: Android 交叉编译生成 .deb + libproot.so dlopen 检测 + 模拟器测试
  # ============================================================
  build-termux:
    name: Build & Verify (Android ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm]
      fail-fast: false
    steps:
      - name: Checkout Pbox
        uses: actions/checkout@v4
        with:
          path: Pbox

      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: fengchenkeji/termux-packages
          path: termux-packages
          ref: master

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq binutils qemu-user-static zip dpkg-dev

      - name: Download libproot.so from Android-Proot-Builder release
        run: |
          echo "Downloading from: ${PROOT_RELEASE_URL}"
          curl -fL -o /tmp/proot-android.zip "${PROOT_RELEASE_URL}"
          unzip -l /tmp/proot-android.zip

      - name: Extract and static-verify libproot.so
        run: |
          unzip -o /tmp/proot-android.zip -d /tmp/proot-release

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            RELEASE_DIR="aarch64"
            EXPECTED_MACHINE="AArch64"
          else
            RELEASE_DIR="armv7a"
            EXPECTED_MACHINE="ARM"
          fi

          SO="/tmp/proot-release/${RELEASE_DIR}/libproot.so"
          echo "=== 1. file type ==="
          file "$SO"
          file "$SO" | grep -q "shared object" || { echo "::error::not shared object"; exit 1; }

          echo "=== 2. ELF architecture ==="
          readelf -h "$SO" | grep -E "Class|Type|Machine"
          readelf -h "$SO" | grep -q "${EXPECTED_MACHINE}" || { echo "::error::arch mismatch"; exit 1; }

          echo "=== 3. main symbol ==="
          if readelf -s --wide "$SO" | grep -w "main" | grep -q "GLOBAL"; then
            echo "[OK] main in .dynsym (GLOBAL)"
          elif nm "$SO" 2>/dev/null | grep -w "main" | grep -q " T "; then
            echo "[OK] main in .symtab (ELF fallback)"
          else
            echo "::error::main symbol not found"
            exit 1
          fi

          echo "=== 4. NEEDED deps ==="
          readelf -d "$SO" | grep NEEDED || echo "(statically linked)"

          echo "=== 5. loader files ==="
          ls -la /tmp/proot-release/${RELEASE_DIR}/
          echo "[PASS] Static verification passed"

      - name: Build pbox .deb with termux Docker
        run: |
          cd termux-packages
          # The termux-packages repo already has packages/pbox/build.sh
          # which uses git+https source and builds all deps automatically
          echo "=== pbox package build.sh ==="
          cat packages/pbox/build.sh

          echo "=== Starting build for ${{ matrix.arch }} ==="
          # Run build, capture output to file, then print it
          docker run --rm \
            -v "$(pwd):/home/builder/termux-packages" \
            -e TERMUX_ARCH=${{ matrix.arch }} \
            ghcr.io/termux/package-builder:latest \
            ./build-package.sh -a ${{ matrix.arch }} pbox > build-${{ matrix.arch }}.log 2>&1
          BUILD_RC=$?
          echo "=== Build exit code: ${BUILD_RC} ==="
          echo "=== Build log (last 100 lines) ==="
          tail -100 build-${{ matrix.arch }}.log
          if [ ${BUILD_RC} -ne 0 ]; then
            echo "::error::Termux build failed (exit ${BUILD_RC})"
            exit ${BUILD_RC}
          fi

      - name: Verify .deb packages
        run: |
          cd termux-packages
          echo "=== output/ contents ==="
          ls -la output/ 2>/dev/null || echo "no output dir"
          DEB_FILES=$(find output -name "*.deb" -type f 2>/dev/null)
          if [ -z "$DEB_FILES" ]; then
            echo "::error::No .deb files found in output/"
            find . -name "*.deb" 2>/dev/null
            exit 1
          fi
          echo "=== Found .deb files ==="
          echo "$DEB_FILES"
          for f in $DEB_FILES; do
            echo "--- $f ---"
            ls -la "$f"
            dpkg-deb --info "$f" 2>/dev/null | head -8
          done
          PBOX_DEB=$(find output -name "pbox*.deb" -type f | head -1)
          [ -n "$PBOX_DEB" ] && echo "[OK] pbox .deb: $PBOX_DEB" || echo "::warning::pbox .deb not found by name"

      - name: Emulator test (qemu-user) - extract .deb and run pbox
        run: |
          cd termux-packages
          PBOX_DEB=$(find output -name "pbox*.deb" -type f | head -1)
          if [ -z "$PBOX_DEB" ]; then
            echo "::warning::No pbox .deb, skipping emulator test"
            exit 0
          fi

          # Extract pbox .deb
          mkdir -p /tmp/pbox-rootfs
          dpkg-deb -x "$PBOX_DEB" /tmp/pbox-rootfs/
          echo "=== Extracted pbox files ==="
          find /tmp/pbox-rootfs -type f | head -20

          PBOX_BIN=/tmp/pbox-rootfs/data/data/com.termux/files/usr/opt/Pbox/pbox
          echo "=== pbox binary ==="
          file "$PBOX_BIN" 2>/dev/null || echo "pbox not found at expected path"

          # Find NDK sysroot via docker
          NDK_SYSROOT=$(docker run --rm ghcr.io/termux/package-builder:latest \
            /bin/bash -c 'find / -path "*/sysroot/usr/lib" -type d 2>/dev/null | head -1' 2>/dev/null || echo "")
          echo "NDK sysroot: $NDK_SYSROOT"

          # Run pbox --help with qemu-user inside docker (has NDK + qemu)
          docker run --rm \
            -v /tmp/pbox-rootfs:/tmp/pbox-rootfs \
            --privileged \
            ghcr.io/termux/package-builder:latest \
            /bin/bash -c "
              apt-get update -qq && apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || true
              NDK_BIN=\$(find / -path '*/toolchains/llvm/prebuilt/*/bin' -type d 2>/dev/null | head -1)
              NDK_ROOT=\$(dirname \"\$(dirname \"\$NDK_BIN\")\")
              export QEMU_LD_PREFIX=\"\$NDK_ROOT/sysroot\"
              export LD_LIBRARY_PATH=/tmp/pbox-rootfs/data/data/com.termux/files/usr/lib:\$LD_LIBRARY_PATH
              if [ '${{ matrix.arch }}' = 'aarch64' ]; then
                qemu-aarch64-static /tmp/pbox-rootfs/data/data/com.termux/files/usr/opt/Pbox/pbox --help 2>&1 || true
              else
                qemu-arm-static /tmp/pbox-rootfs/data/data/com.termux/files/usr/opt/Pbox/pbox --help 2>&1 || true
              fi
            " || echo "::warning::Emulator test had issues (qemu may not fully support Android binaries)"

      - name: Upload Termux build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-build-logs-${{ matrix.arch }}
          path: termux-packages/build-*.log
          retention-days: 7

      - name: Upload Termux deb packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbox-termux-${{ matrix.arch }}
          path: termux-packages/output/*.deb
          retention-days: 30
