name: Pbox CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Android-Proot-Builder release download URL (public, no token needed)
  PROOT_RELEASE_URL: https://github.com/fengchenkeji/Android-Proot-Builder/releases/download/proot-latest/proot-android.zip

jobs:
  # ============================================================
  # Job 1: Linux x86_64 构建 + libproot.so dlopen 实际调用测试
  # ============================================================
  build-linux:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            libspdlog-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            libtalloc-dev \
            libarchive-dev \
            binutils \
            zip

      - name: Build libproot.so from source (Linux glibc)
        run: |
          # Android-Proot-Builder 的 x86_64 产物是 Android Bionic 版本，无法在 Linux glibc 上 dlopen
          # 因此 Linux job 从 termux/proot 源码用本机 gcc 编译 glibc 版本的 libproot.so
          chmod +x scripts/build-proot-linux.sh
          ./scripts/build-proot-linux.sh lib/x86_64
          ls -la lib/x86_64/

      - name: Verify libproot.so (static analysis)
        run: |
          SO=lib/x86_64/libproot.so
          echo "=== file ==="
          file "$SO"
          echo "=== ELF header ==="
          readelf -h "$SO" | grep -E "Class|Type|Machine"
          echo "=== main symbol ==="
          readelf -s --wide "$SO" | grep -w "main" || echo "main not in .dynsym, checking .symtab..."
          nm "$SO" 2>/dev/null | grep -w "main" || echo "main not found via nm"
          echo "=== dynamic dependencies ==="
          readelf -d "$SO" | grep NEEDED || true
          # Must be a shared object
          if file "$SO" | grep -q "shared object"; then
            echo "[OK] libproot.so is a shared object"
          else
            echo "::error::libproot.so is NOT a shared object"
            exit 1
          fi

      - name: Configure Pbox
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Os -Wall"

      - name: Build Pbox
        run: |
          cmake --build build -j$(nproc)

      - name: Verify build artifacts
        run: |
          echo "=== Build output ==="
          ls -la build/
          ls -la build/lib/
          file build/main
          file build/lib/libinitialization.so

      - name: Test libproot.so dlopen call chain
        run: |
          chmod +x scripts/test-proot-call.sh
          ./scripts/test-proot-call.sh build

      - name: Test Pbox CLI
        run: |
          cd build
          echo "=== pbox --help ==="
          ./main --help
          echo ""
          echo "=== pbox list (first 10 lines) ==="
          ./main list 2>&1 | head -10 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbox-linux-x86_64
          path: |
            build/main
            build/lib/*.so
            lib/x86_64/libproot.so
          retention-days: 7

  # ============================================================
  # Job 2 & 3: Android 交叉编译 + libproot.so dlopen 检测
  # ============================================================
  build-termux:
    name: Build & Verify (Android ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm]
      fail-fast: false
    steps:
      - name: Checkout Pbox
        uses: actions/checkout@v4
        with:
          path: Pbox

      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: fengchenkeji/termux-packages
          path: termux-packages
          ref: master

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq binutils qemu-user-static zip

      - name: Download libproot.so from Android-Proot-Builder release
        run: |
          echo "Downloading from: ${PROOT_RELEASE_URL}"
          curl -fL -o /tmp/proot-android.zip "${PROOT_RELEASE_URL}"
          unzip -l /tmp/proot-android.zip

      - name: Extract and place libproot.so by architecture
        run: |
          unzip -o /tmp/proot-android.zip -d /tmp/proot-release
          echo "=== Extracted files ==="
          find /tmp/proot-release -type f

          # Map release arch dirs to Pbox lib dirs
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            SO_ARCH_DIR="arm64‑v8a"
            RELEASE_DIR="aarch64"
          else
            SO_ARCH_DIR="armeabi‑v7a"
            RELEASE_DIR="armv7a"
          fi

          mkdir -p "Pbox/lib/${SO_ARCH_DIR}"
          # Try both possible zip structures
          if [ -d "/tmp/proot-release/${RELEASE_DIR}" ]; then
            cp -v /tmp/proot-release/${RELEASE_DIR}/* "Pbox/lib/${SO_ARCH_DIR}/"
          elif [ -d "/tmp/proot-release/output/${RELEASE_DIR}" ]; then
            cp -v /tmp/proot-release/output/${RELEASE_DIR}/* "Pbox/lib/${SO_ARCH_DIR}/"
          else
            echo "::error::Cannot find ${RELEASE_DIR} in release zip"
            find /tmp/proot-release -type d
            exit 1
          fi
          echo "=== Placed files in Pbox/lib/${SO_ARCH_DIR}/ ==="
          ls -la "Pbox/lib/${SO_ARCH_DIR}/"

      - name: Static verification of libproot.so
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            SO_DIR="Pbox/lib/arm64‑v8a"
            EXPECTED_MACHINE="AArch64"
          else
            SO_DIR="Pbox/lib/armeabi‑v7a"
            EXPECTED_MACHINE="ARM"
          fi
          SO="${SO_DIR}/libproot.so"

          echo "=== 1. file type check ==="
          file "$SO"
          if file "$SO" | grep -q "shared object"; then
            echo "[OK] is shared object"
          else
            echo "::error::NOT a shared object"
            exit 1
          fi

          echo "=== 2. ELF architecture check ==="
          readelf -h "$SO" | grep -E "Class|Type|Machine"
          if readelf -h "$SO" | grep -q "${EXPECTED_MACHINE}"; then
            echo "[OK] architecture matches ${{ matrix.arch }}"
          else
            echo "::error::architecture mismatch"
            exit 1
          fi

          echo "=== 3. main symbol check ==="
          # Check .dynsym first
          if readelf -s --wide "$SO" | grep -w "main" | grep -q "GLOBAL"; then
            echo "[OK] main symbol in .dynsym (GLOBAL) — dlsym can find it directly"
            readelf -s --wide "$SO" | grep -w "main" | grep "GLOBAL"
          elif nm "$SO" 2>/dev/null | grep -w "main" | grep -q " T "; then
            echo "[OK] main symbol in .symtab — ELF fallback will resolve it"
            nm "$SO" 2>/dev/null | grep -w "main"
          else
            echo "::error::main symbol NOT found in .dynsym or .symtab"
            exit 1
          fi

          echo "=== 4. dynamic dependencies ==="
          readelf -d "$SO" | grep NEEDED || echo "(no NEEDED entries or statically linked)"

          echo "=== 5. loader files check ==="
          ls -la "${SO_DIR}/"libproot-loader*.so 2>/dev/null || echo "No loader files"
          for loader in "${SO_DIR}/"libproot-loader*.so; do
            [ -f "$loader" ] && file "$loader"
          done

          echo ""
          echo "[PASS] All static checks passed for ${{ matrix.arch }}"

      - name: Cross-compile dlopen test program (NDK)
        run: |
          # Write test program
          cat > /tmp/test_dlopen.c << 'CEOF'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          typedef int (*ProotMain)(int, char**);
          int main(int argc, char** argv) {
              const char* so_path = (argc > 1) ? argv[1] : "./libproot.so";
              fprintf(stderr, "[TEST] dlopen(%s)...\n", so_path);
              void* h = dlopen(so_path, RTLD_NOW | RTLD_GLOBAL);
              if (!h) { fprintf(stderr, "[TEST] FAIL dlopen: %s\n", dlerror()); return 1; }
              fprintf(stderr, "[TEST] OK dlopen handle=%p\n", h);
              fprintf(stderr, "[TEST] dlsym(main)...\n");
              ProotMain pm = (ProotMain)dlsym(h, "main");
              if (!pm) { fprintf(stderr, "[TEST] FAIL dlsym: %s\n", dlerror()); dlclose(h); return 2; }
              fprintf(stderr, "[TEST] OK main=%p\n", (void*)pm);
              fprintf(stderr, "[TEST] PASS: libproot.so loaded and main resolved\n");
              dlclose(h);
              return 0;
          }
          CEOF

          # Use Termux Docker to cross-compile with NDK (source build env first)
          docker pull ghcr.io/termux/package-builder:latest 2>/dev/null || true
          docker run --rm \
            -v /tmp:/tmp \
            -e TERMUX_ARCH=${{ matrix.arch }} \
            -w /home/builder/termux-packages \
            ghcr.io/termux/package-builder:latest \
            /bin/bash -c '
              set -e
              # Source the NDK environment setup
              source ./scripts/setup/termux_setup_toolchain.sh 2>/dev/null || true
              export TERMUX_ARCH=${{ matrix.arch }}
              # Determine compiler
              if [ "${{ matrix.arch }}" = "aarch64" ]; then
                CC=aarch64-linux-android-clang
              else
                CC=armv7a-linux-androideabi-clang
              fi
              echo "Using compiler: $CC"
              which $CC || (echo "Finding NDK clang..." && find / -name "aarch64-linux-android*-clang" 2>/dev/null | head -3)
              # Try NDK toolchain path
              NDK_BIN=$(find / -path "*/toolchains/llvm/prebuilt/*/bin" -type d 2>/dev/null | head -1)
              if [ -n "$NDK_BIN" ]; then
                export PATH="$NDK_BIN:$PATH"
                echo "NDK bin: $NDK_BIN"
                ls "$NDK_BIN"/*clang* 2>/dev/null | head -5
              fi
              $CC -O2 /tmp/test_dlopen.c -o /tmp/test_dlopen_${{ matrix.arch }} -ldl 2>&1
              file /tmp/test_dlopen_${{ matrix.arch }}
              echo "[OK] Cross-compiled test_dlopen_${{ matrix.arch }}"
            ' || echo "::warning::Cross-compile test skipped (NDK env issue), static checks still apply"

      - name: Runtime dlopen test with qemu-user
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            SO_DIR="Pbox/lib/arm64‑v8a"
            QEMU="qemu-aarch64-static"
          else
            SO_DIR="Pbox/lib/armeabi‑v7a"
            QEMU="qemu-arm-static"
          fi

          # Get Android sysroot from Termux Docker
          docker pull ghcr.io/termux/package-builder:latest 2>/dev/null || true
          SYSROOT=$(docker run --rm ghcr.io/termux/package-builder:latest \
            /bin/bash -c 'echo $PREFIX' 2>/dev/null || echo "")
          echo "Termux PREFIX: $SYSROOT"

          # Copy libproot.so to /tmp for qemu access
          cp "${SO_DIR}/libproot.so" /tmp/libproot_${{ matrix.arch }}.so

          echo "=== Running dlopen test with $QEMU ==="
          # qemu needs the Android linker and libc; use the container's sysroot
          # Run inside Docker with qemu installed to ensure correct sysroot
          docker run --rm \
            -v /tmp:/tmp \
            --privileged \
            ghcr.io/termux/package-builder:latest \
            /bin/bash -c "
              set -e
              apt-get update -qq && apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || true
              export QEMU_LD_PREFIX=\$PREFIX
              if [ '${{ matrix.arch }}' = 'aarch64' ]; then
                qemu-aarch64-static /tmp/test_dlopen_aarch64 /tmp/libproot_aarch64.so
              else
                qemu-arm-static /tmp/test_dlopen_arm /tmp/libproot_arm.so
              fi
            " || {
              echo "::warning::qemu runtime test failed (may be environment limitation), static+link checks passed"
              # Don't fail the job on qemu test failure; static checks already verified
            }

      - name: Prepare Pbox source for termux build
        run: |
          cd Pbox
          tar czf ../pbox-src.tar.gz --exclude=.git .
          cd ..
          SHA256=$(sha256sum pbox-src.tar.gz | awk '{print $1}')
          echo "PBOX_SRC_SHA256=$SHA256" >> $GITHUB_ENV
          echo "Source SHA256: $SHA256"
          ls -la pbox-src.tar.gz

      - name: Build with termux Docker
        run: |
          set -o pipefail
          cd termux-packages

          mkdir -p packages/pbox
          cat > packages/pbox/build.sh << 'PKGEOF'
          TERMUX_PKG_HOMEPAGE=https://github.com/fengchenkeji/Pbox
          TERMUX_PKG_DESCRIPTION="A proot container management tool for Termux"
          TERMUX_PKG_LICENSE="GPL-3.0"
          TERMUX_PKG_LICENSE_FILE="COPYING"
          TERMUX_PKG_MAINTAINER="fengchenkeji <399233159@qq.com>"
          TERMUX_PKG_VERSION=0.0.1
          TERMUX_PKG_SRCURL=file:///tmp/pbox-src.tar.gz
          TERMUX_PKG_SHA256=PLACEHOLDER_SHA256
          TERMUX_PKG_DEPENDS="libspdlog, libcurl, talloc, fmt, proot"
          TERMUX_PKG_BUILD_IN_SRC=true

          termux_step_make() {
              cmake -S . -B build \
                  -Wno-unused-cli \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX="${TERMUX_PREFIX}" \
                  -DCMAKE_CXX_FLAGS="${CXXFLAGS}" \
                  -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}"
              make -C build -j"$(nproc)"
          }

          termux_step_make_install() {
              local INSTALL_ROOT="${TERMUX_PREFIX}/opt/Pbox"
              mkdir -p "${INSTALL_ROOT}/lib"
              mkdir -p "${INSTALL_ROOT}/res"
              mkdir -p "${TERMUX_PREFIX}/bin"
              cp -f "${TERMUX_PKG_SRCDIR}/build/main" "${INSTALL_ROOT}/pbox"
              chmod +x "${INSTALL_ROOT}/pbox"
              if [ "${TERMUX_ARCH}" = "aarch64" ]; then
                  SO_ARCH_DIR="arm64‑v8a"
              else
                  SO_ARCH_DIR="armeabi‑v7a"
              fi
              local SO_SRC_DIR="${TERMUX_PKG_SRCDIR}/lib/${SO_ARCH_DIR}"
              if [ -d "${SO_SRC_DIR}" ]; then
                  cp -f "${SO_SRC_DIR}/"*.so* "${INSTALL_ROOT}/lib/" 2>/dev/null || true
              fi
              if [ -d "${TERMUX_PKG_SRCDIR}/build/lib" ]; then
                  cp -f "${TERMUX_PKG_SRCDIR}/build/lib/"*.so "${INSTALL_ROOT}/lib/" 2>/dev/null || true
              fi
              if [ -d "${TERMUX_PKG_SRCDIR}/res" ]; then
                  cp -r "${TERMUX_PKG_SRCDIR}/res/"* "${INSTALL_ROOT}/res/" 2>/dev/null || true
              fi
              cat > "${TERMUX_PREFIX}/bin/pbox" << 'PBLAUNCHER'
          #!/data/data/com.termux/files/usr/bin/sh
          export LD_LIBRARY_PATH="${PREFIX}/opt/Pbox/lib:${LD_LIBRARY_PATH}"
          exec "${PREFIX}/opt/Pbox/pbox" "$@"
          PBLAUNCHER
              chmod +x "${TERMUX_PREFIX}/bin/pbox"
          }
          PKGEOF

          sed -i "s/PLACEHOLDER_SHA256/${PBOX_SRC_SHA256}/" packages/pbox/build.sh
          cp ../pbox-src.tar.gz /tmp/pbox-src.tar.gz

          # Ensure output directory exists and is writable
          mkdir -p output
          chmod 777 output 2>/dev/null || true

          docker pull ghcr.io/termux/package-builder:latest 2>/dev/null || true

          echo "=== Starting Termux build for ${{ matrix.arch }} ==="
          docker run --rm \
            -v "$(pwd):/home/builder/termux-packages" \
            -v "/tmp/pbox-src.tar.gz:/tmp/pbox-src.tar.gz" \
            -e TERMUX_ARCH=${{ matrix.arch }} \
            ghcr.io/termux/package-builder:latest \
            ./build-package.sh -a ${{ matrix.arch }} pbox 2>&1 | tee build-${{ matrix.arch }}.log
          DOCKER_EXIT=${PIPESTATUS[0]}
          echo "=== Docker build exit code: ${DOCKER_EXIT} ==="

          if [ ${DOCKER_EXIT} -ne 0 ]; then
            echo "::error::Termux build failed with exit code ${DOCKER_EXIT}"
            echo "=== Last 80 lines of build log ==="
            tail -80 build-${{ matrix.arch }}.log
            exit ${DOCKER_EXIT}
          fi

      - name: Verify .deb packages
        run: |
          cd termux-packages
          echo "=== Searching for .deb files ==="
          DEB_FILES=$(find . -name "*.deb" -type f 2>/dev/null)
          if [ -z "$DEB_FILES" ]; then
            echo "::error::No .deb files found! Build may have failed."
            echo "=== output/ directory ==="
            ls -la output/ 2>/dev/null || echo "output/ does not exist"
            echo "=== Build log tail ==="
            tail -50 build-${{ matrix.arch }}.log 2>/dev/null || echo "no log"
            exit 1
          fi
          echo "Found .deb files:"
          echo "$DEB_FILES"
          echo ""
          echo "=== .deb file details ==="
          for f in $DEB_FILES; do
            ls -la "$f"
            dpkg-deb --info "$f" 2>/dev/null | head -10 || true
            echo "---"
          done
          # Verify pbox .deb exists
          PBOX_DEB=$(find . -name "pbox*.deb" -type f 2>/dev/null | head -1)
          if [ -z "$PBOX_DEB" ]; then
            echo "::warning::pbox .deb not found by name, checking all debs..."
          else
            echo "[OK] pbox .deb found: $PBOX_DEB"
          fi

      - name: Emulator test (qemu-user) - run pbox and libproot.so
        run: |
          cd termux-packages
          # Write test script that runs inside Termux Docker
          cat > /tmp/qemu-test.sh << 'QEOF'
          set -e
          echo "=== Emulator test for ${{ matrix.arch }} ==="

          # Install qemu-user-static
          apt-get update -qq && apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || true

          # Find NDK sysroot
          NDK_BIN=$(find / -path "*/toolchains/llvm/prebuilt/*/bin" -type d 2>/dev/null | head -1)
          NDK_ROOT=$(dirname "$(dirname "$NDK_BIN")")
          SYSROOT="${NDK_ROOT}/sysroot"
          echo "NDK_ROOT: $NDK_ROOT"
          echo "SYSROOT: $SYSROOT"
          ls "$SYSROOT/usr/lib/" 2>/dev/null | head -10

          # Determine qemu binary and arch-specific paths
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            QEMU=qemu-aarch64-static
            ANDROID_ARCH=aarch64-linux-android
            SO_ARCH_DIR="arm64‑v8a"
          else
            QEMU=qemu-arm-static
            ANDROID_ARCH=arm-linux-androideabi
            SO_ARCH_DIR="armeabi‑v7a"
          fi
          echo "QEMU: $QEMU"
          which $QEMU || echo "qemu not found, trying without static suffix"
          QEMU=$(which $QEMU 2>/dev/null || which qemu-aarch64 2>/dev/null || which qemu-arm 2>/dev/null || echo "")
          if [ -z "$QEMU" ]; then
            echo "::error::qemu-user not available"
            exit 1
          fi

          # Extract all .deb packages to /tmp/rootfs
          mkdir -p /tmp/rootfs
          for deb in /home/builder/termux-packages/output/*.deb; do
            echo "Extracting: $(basename $deb)"
            dpkg-deb -x "$deb" /tmp/rootfs/ 2>/dev/null || true
          done

          echo "=== Extracted structure ==="
          find /tmp/rootfs -name "pbox" -o -name "libproot.so" 2>/dev/null
          ls -la /tmp/rootfs/data/data/com.termux/files/usr/opt/Pbox/ 2>/dev/null || true

          PBOX_BIN=/tmp/rootfs/data/data/com.termux/files/usr/opt/Pbox/pbox
          PROOT_SO=/tmp/rootfs/data/data/com.termux/files/usr/opt/Pbox/lib/libproot.so
          TERMUX_LIB=/tmp/rootfs/data/data/com.termux/files/usr/lib

          echo ""
          echo "=== Test 1: pbox binary file type ==="
          file "$PBOX_BIN"

          echo ""
          echo "=== Test 2: pbox --help (qemu-user) ==="
          export QEMU_LD_PREFIX="$SYSROOT"
          export LD_LIBRARY_PATH="${TERMUX_LIB}:${SYSROOT}/usr/lib/${ANDROID_ARCH}:${SYSROOT}/usr/lib"
          $QEMU "$PBOX_BIN" --help 2>&1 || echo "pbox --help exit: $?"

          echo ""
          echo "=== Test 3: dlopen libproot.so + proot --version (qemu-user) ==="
          # Write dlopen test
          cat > /tmp/test_proot_dlopen.c << 'CEOF'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <unistd.h>
          typedef int (*ProotMain)(int, char**);
          int main(int argc, char** argv) {
              const char* so = (argc>1)?argv[1]:"./libproot.so";
              fprintf(stderr, "[TEST] dlopen(%s)...\n", so);
              void* h = dlopen(so, RTLD_NOW|RTLD_GLOBAL);
              if(!h){fprintf(stderr,"[TEST] FAIL dlopen: %s\n",dlerror());return 1;}
              fprintf(stderr,"[TEST] OK dlopen\n");
              ProotMain pm=(ProotMain)dlsym(h,"main");
              if(!pm){fprintf(stderr,"[TEST] FAIL dlsym: %s\n",dlerror());dlclose(h);return 2;}
              fprintf(stderr,"[TEST] OK dlsym main=%p\n",(void*)pm);
              pid_t pid=fork();
              if(pid==0){
                  char* a[]={"proot","--version",NULL};
                  _exit(pm(2,a));
              }
              int st; waitpid(pid,&st,0);
              int rc=WIFEXITED(st)?WEXITSTATUS(st):-1;
              fprintf(stderr,"[TEST] proot --version exit=%d\n",rc);
              dlclose(h);
              return (rc==0)?0:3;
          }
          CEOF
          # Cross-compile test with NDK clang
          export PATH="$NDK_BIN:$PATH"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            aarch64-linux-android-clang -O2 /tmp/test_proot_dlopen.c -o /tmp/test_dlopen -ldl
          else
            armv7a-linux-androideabi-clang -O2 /tmp/test_proot_dlopen.c -o /tmp/test_dlopen -ldl
          fi
          file /tmp/test_dlopen
          $QEMU /tmp/test_dlopen "$PROOT_SO" 2>&1
          TEST_RC=$?
          echo "dlopen test exit: $TEST_RC"

          if [ $TEST_RC -eq 0 ]; then
            echo "[PASS] All emulator tests passed for ${{ matrix.arch }}"
          else
            echo "::warning::Some emulator tests failed (exit $TEST_RC), checking if non-fatal..."
          fi
          QEOF

          # Run test inside Docker with all volumes mounted
          docker run --rm \
            -v "$(pwd):/home/builder/termux-packages" \
            -v /tmp:/tmp \
            --privileged \
            ghcr.io/termux/package-builder:latest \
            /bin/bash /tmp/qemu-test.sh 2>&1 || echo "::warning::Emulator test completed with issues (see above)"

      - name: Upload Termux build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-build-logs-${{ matrix.arch }}
          path: termux-packages/build-*.log
          retention-days: 7

      - name: Upload Termux deb packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbox-termux-${{ matrix.arch }}
          path: termux-packages/**/*.deb
          retention-days: 30
