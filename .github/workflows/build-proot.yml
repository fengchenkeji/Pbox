name: Build proot binaries

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-proot.yml'
      - 'scripts/build-proot-android.sh'
  workflow_dispatch:
    inputs:
      proot_version:
        description: 'proot version tag (e.g. v5.1.107.92)'
        required: false
        default: 'v5.1.107.92'

env:
  PROOT_REPO: https://github.com/termux/proot.git
  PROOT_VERSION: ${{ github.event.inputs.proot_version || 'v5.1.107.92' }}

jobs:
  build-proot-android:
    name: Build proot for Android ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            arch_name: arm64
            tripl3: aarch64-linux-android
            sdk_version: 24
            abi: arm64-v8a
          - arch: arm
            arch_name: arm32
            tripl3: arm-linux-androideabi
            sdk_version: 21
            abi: armeabi-v7a
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK_DIR=""
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK..."
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
            yes | "$SDKMANAGER" --install "ndk;26.1.10909125" 2>&1 | tail -5
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          fi
          echo "NDK_DIR=$NDK_DIR"
          HOST_TAG=$(ls "$NDK_DIR/toolchains/llvm/prebuilt/" | head -1)
          echo "HOST_TAG=$HOST_TAG"
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "HOST_TAG=$HOST_TAG" >> $GITHUB_ENV

      - name: Download libtalloc from Termux
        run: |
          REPO_ARCH="${{ matrix.arch }}"
          REPO="https://packages.termux.dev/apt/termux-main"
          curl -fL "${REPO}/dists/stable/main/binary-${REPO_ARCH}/Packages" -o /tmp/Packages

          # 查找所有 talloc 相关包
          echo "=== Available talloc packages ==="
          grep "^Package:.*talloc" /tmp/Packages

          # 下载 libtalloc 运行时
          TALLOC_DEB=$(grep -A20 "^Package: libtalloc$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          echo "libtalloc deb: ${TALLOC_DEB}"
          curl -fL "${REPO}/${TALLOC_DEB}" -o /tmp/libtalloc.deb
          mkdir -p /tmp/talloc
          dpkg-deb -x /tmp/libtalloc.deb /tmp/talloc
          find /tmp/talloc -name "libtalloc*"

          # 下载 talloc 开发头文件（包名可能是 talloc-dev 或 libtalloc-dev）
          TALLOC_DEV_DEB=$(grep -A20 "^Package: talloc-dev$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          if [ -z "$TALLOC_DEV_DEB" ]; then
            TALLOC_DEV_DEB=$(grep -A20 "^Package: libtalloc-dev$" /tmp/Packages | grep "^Filename:" | head -1 | awk '{print $2}')
          fi
          if [ -n "$TALLOC_DEV_DEB" ]; then
            echo "talloc dev deb: ${TALLOC_DEV_DEB}"
            curl -fL "${REPO}/${TALLOC_DEV_DEB}" -o /tmp/libtalloc-dev.deb
            mkdir -p /tmp/talloc-dev
            dpkg-deb -x /tmp/libtalloc-dev.deb /tmp/talloc-dev
            find /tmp/talloc-dev -name "talloc.h"
            TALLOC_INC_PATH=$(find /tmp/talloc-dev -name "talloc.h" -exec dirname {} \; | head -1)
          else
            echo "WARN: no talloc-dev package found, searching in libtalloc runtime"
            TALLOC_INC_PATH=$(find /tmp/talloc -name "talloc.h" -exec dirname {} \; | head -1)
          fi

          echo "TALLOC_LIB=/tmp/talloc/data/data/com.termux/files/usr/lib" >> $GITHUB_ENV
          echo "TALLOC_INC=${TALLOC_INC_PATH}" >> $GITHUB_ENV
          echo "TALLOC_INC=${TALLOC_INC_PATH}"
          ls -la "${TALLOC_INC_PATH}/talloc.h"

      - name: Clone and build proot
        run: |
          set -e
          NDK_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/${HOST_TAG}/bin"
          TRIPLE="${{ matrix.tripl3 }}"
          API="${{ matrix.sdk_version }}"
          CC="${NDK_BIN}/${TRIPLE}${API}-clang"

          echo "=== Using compiler: ${CC} ==="
          ls -la "${CC}"

          # Clone proot source
          mkdir -p /tmp/proot-build
          cd /tmp/proot-build
          git clone --depth 1 --branch "${PROOT_VERSION}" "${PROOT_REPO}" proot 2>/dev/null || \
          git clone --depth 1 "${PROOT_REPO}" proot

          cd proot/src

          # Build proot as executable
          make clean 2>/dev/null || true

          # Include paths for talloc
          TALLOC_CFLAGS="-I${TALLOC_INC}"
          TALLOC_LDFLAGS="-L${TALLOC_LIB} -ltalloc"

          make -j"$(nproc)" \
            CC="${CC}" \
            CFLAGS="-O2 -DARG_MAX=131072 -DVERSION=\"${PROOT_VERSION}\" ${TALLOC_CFLAGS}" \
            LDFLAGS="${TALLOC_LDFLAGS} -Wl,-z,noexecstack" \
            V=0

          # Verify
          file proot
          readelf -h proot | grep -E "Class|Type|Machine"

          # Copy output
          mkdir -p $GITHUB_WORKSPACE/output/${{ matrix.abi }}
          cp proot $GITHUB_WORKSPACE/output/${{ matrix.abi }}/proot
          chmod +x $GITHUB_WORKSPACE/output/${{ matrix.abi }}/proot

          # Also check for loader files (Android proot needs external loader)
          find /tmp/proot-build/proot -name "*loader*" -type f 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/output/${{ matrix.abi }}/

      - name: Test proot --version (qemu-user)
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            QEMU="qemu-aarch64-static"
          else
            QEMU="qemu-arm-static"
          fi
          sudo apt-get install -y -qq qemu-user-static
          ANDROID_SYSROOT="${NDK_DIR}/toolchains/llvm/prebuilt/${HOST_TAG}/sysroot"
          export QEMU_LD_PREFIX="$ANDROID_SYSROOT"
          export LD_LIBRARY_PATH="/tmp/talloc/data/data/com.termux/files/usr/lib:${LD_LIBRARY_PATH}"
          $QEMU $GITHUB_WORKSPACE/output/${{ matrix.abi }}/proot --version

      - name: Upload proot binary
        uses: actions/upload-artifact@v4
        with:
          name: proot-${{ matrix.arch_name }}
          path: output/${{ matrix.abi }}/proot
          retention-days: 30

      - name: Upload combined release asset
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: proot-android-binaries
          path: output/
          retention-days: 90
